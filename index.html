<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cổng Thông Tin Phụ Huynh</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
.box{max-width:460px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px 28px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.08);}
.ico{font-size:2.6rem;margin-bottom:12px;}
h1{font-size:1.25rem;margin:0 0 8px;}
p{color:#64748b;font-size:.92rem;margin:0;line-height:1.55;}
</style></head><body>
<div class="box">
  <div class="ico">🔒</div>
  <h1>Cổng Thông Tin Phụ Huynh</h1>
  <p>Vui lòng mở đúng đường dẫn riêng mà giáo viên đã gửi cho gia đình để xem tình hình học tập và tài liệu của học sinh.</p>
</div>
</body></html>
